name: Build and publish Nightmare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nightmare-JAR
          path: build/libs/nightmare-1.0.0.jar
      - name: Publish latest JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightmare-latest
          name: Nightmare latest build
          prerelease: true
          make_latest: false
          files: build/libs/nightmare-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
