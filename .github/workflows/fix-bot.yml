name: Fix bot interaction handling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bot.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.js
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text(encoding='utf-8')

          helper = '''\nfunction hasPermission(interaction, permission) {\n    return interaction.memberPermissions?.has(permission) ?? false;\n}\n\nfunction getInvokerMember(interaction) {\n    return interaction.guild?.members.cache.get(interaction.user.id) || null;\n}\n\nfunction hasHighRoleForDm(interaction) {\n    if (hasPermission(interaction, PermissionsBitField.Flags.Administrator)) return true;\n    const invoker = getInvokerMember(interaction);\n    const botMember = interaction.guild?.members.me;\n    if (!invoker || !botMember) return false;\n    return invoker.roles.highest.position > botMember.roles.highest.position;\n}\n'''

          marker = "const SONG_FILE =\n"
          if 'function hasPermission(interaction, permission)' not in s:
              s = s.replace(marker, helper + "\n" + marker, 1)

          s = s.replace('interaction.member.permissions.has(', 'hasPermission(interaction, ')
          s = s.replace("client.once('ready', async () => {", "client.once('clientReady', async () => {")
          s = s.replace('const member = interaction.member;', 'const member = getInvokerMember(interaction);')

          old_high = '''const hasHighRole =\n            hasPermission(interaction, PermissionsBitField.Flags.Administrator) ||\n            interaction.member.roles.highest.position >=\n            interaction.guild.members.me.roles.highest.position;'''
          s = s.replace(old_high, 'const hasHighRole = hasHighRoleForDm(interaction);')

          old_userinfo = "const member = interaction.options.getMember('user') || interaction.member;"
          new_userinfo = "const member = interaction.options.getMember('user') || getInvokerMember(interaction);"
          s = s.replace(old_userinfo, new_userinfo)

          p.write_text(s, encoding='utf-8')

      - name: Commit patched bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix Discord interaction permission handling'
            git push
          fi

      - name: Remove one-time fixer
        if: success()
        run: |
          git rm .github/workflows/fix-bot.yml || true
          git commit -m 'Remove temporary bot fixer workflow' || true
          git push || true
