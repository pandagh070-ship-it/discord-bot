name: Start Eto Discord Bot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eto-discord-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp with JavaScript challenge support
        run: python -m pip install --disable-pip-version-check --upgrade "yt-dlp[default]" edge-tts

      - name: Set up Deno for YouTube extraction
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Register commands and start bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_BASE_URL: ${{ secrets.TTS_BASE_URL }}
          TTS_MODEL: ${{ secrets.TTS_MODEL }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
        run: |
          npm run register
          npm start
