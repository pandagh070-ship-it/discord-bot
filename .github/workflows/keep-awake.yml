name: Keep Discord Bot Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render service
        run: |
          curl --fail --silent --show-error --max-time 30 https://discord-bot-5a4b.onrender.com/health || true
