name: Render Bot Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  wake-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render and check bot
        shell: bash
        run: |
          set -e
          URL="https://discord-bot-5a4b.onrender.com/health"

          echo "Checking Render bot..."
          for attempt in 1 2 3; do
            STATUS=$(curl -L -sS -o /tmp/health.json -w "%{http_code}" --max-time 60 "$URL" || true)
            echo "Attempt $attempt: HTTP $STATUS"
            cat /tmp/health.json 2>/dev/null || true
            echo

            if [ "$STATUS" = "200" ]; then
              echo "Bot is awake and healthy."
              exit 0
            fi

            echo "Render is waking up or not ready yet. Waiting 20 seconds..."
            sleep 20
          done

          echo "Render did not return healthy after 3 attempts."
          exit 1
